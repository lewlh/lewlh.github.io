# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: Lewlh's blog
subtitle: ""
description: "豪豪的博客"
keywords: 开发者,程序猿,编程,代码,开源,Developer,Programmer,Coder,Geek
author: 豪豪
language: zh-CN
timezone: "Asia/Shanghai"

# URL
## If your site is put in a subdirectory, set url as 'http://yoursite.com/child' and root as '/child/'
url: https://lewlh.github.io
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:
  - lib/**/*
  - googlea949f035f3a3627f.html

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: true # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ""
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
highlight:
  # enable: true
  exclude_languages:
    - mermaid

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ""
  per_page: 5
  order_by: -date
  pagination_dir: page
  layout: ["index", "archive"]

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss

# Pagination
## Set per_page to 0 to disable pagination
per_page: 5
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
  - lib/pdf/README.md
ignore:

# Deployment
## Deployment is handled by GitHub Actions (see .github/workflows/pages.yml).
## The generated site is uploaded as a Pages artifact, so no hexo deploy target is needed.
deploy:

# Extensions
## Plugins: https://github.com/ludoviclefevre/hexo-generator-seo-friendly-sitemap#readme
sitemap:
    path: sitemap.xml
    tag: false
    category: false

## Plugins: https://github.com/hexojs/hexo-filter-nofollow#readme
nofollow:
  enable: true  #true/false 启用/关闭插件
  field: post   #site/post  处理全站/仅文章链接

hexo_indexnow:
  count: latest # 数字或者 "latest"(=1)
  txt_name: 554f5ab86512440b8c131b94bb9f63e1.txt # 链接文件名
  apikey: 554f5ab86512440b8c131b94bb9f63e1 # 你的 apikey
  server: bing # indexnow 服务器，可选值有:bing、yandex、indexnow

analytics:
    google_analytics:
        enable: false
        measurement_id: <your measurement id>
    microsoft_clarity:
        enable: true
        project_id: naqjf65d7k

## Themes: https://hexo.io/themes/
theme: next

markdown:
  plugins:
    - markdown-it-abbr
    - markdown-it-attrs
    - markdown-it-cjk-breaks
    - markdown-it-container
    - markdown-it-deflist
    - markdown-it-emoji
    - markdown-it-footnote
    - markdown-it-ins
    - markdown-it-mark
    - markdown-it-sub
    - markdown-it-sup
    - '@renbaoshuo/markdown-it-katex'
    - markdown-it-merge-cells